spring.application.name=fake-store-productservice
#DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
fake-store-url=${FAKE_STORE_URL}
server.port=${SERVER_PORT:8082}
product.sync.cron=${PRODUCT_SYNC_CRON:0 0 0 * * *}
spring.data.web.pageable.serialization-mode=via-dto
#Public key
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_PUBLIC_JWT_URL:http://auth-service:8081/api/internal/auth/.well-known/jwks.json}
